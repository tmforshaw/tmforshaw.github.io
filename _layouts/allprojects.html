<html>

{% include head.html %}

<body>

  {% include header.html %}


  <!-- Main -->
  <div id="main" class="alt">

    <!-- One -->
    <section id="one">
      <div class="inner">
        {% for project in site.projects %}
        {% if project.title != 404 %}
        <header class="major">
          <h1><a href="{{ page.github }}"><span>{{ page.title }}</span></a></h1>
        </header>

        {% if project.image %}
        <span class="image main"><img src="{{ project.image | absolute_url }}" alt="" /></span>
        {% endif %}

        {{ project.content }}
        {% endif %}
        {% endfor %}
      </div>
    </section>

  </div>

  {% include footer.html %}

</body>

</html>
